# Same-domain setup: this proxy serves the static frontend and forwards /api/ to the backend, so the browser sees one
# origin (SameSite=lax cookies work, no CORS). TLS certificates go in infrastructure/certs/{fullchain.pem,privkey.pem}.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;

  # Primary rate limits (the app has its own per-process limits as a second layer).
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
  limit_req_status 429;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /srv/site;
    index index.html;

    # Same headers as the frontend's vercel.json, except connect-src 'self' so the app can call /api/ on this origin.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    client_max_body_size 110m;  # the app enforces CASEOPS_MAX_UPLOAD_BYTES; keep this slightly above it

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      include /etc/nginx/proxy_params.conf;
      proxy_pass http://backend:8000;
    }

    location /api/ {
      limit_req zone=api burst=100 nodelay;
      include /etc/nginx/proxy_params.conf;
      proxy_pass http://backend:8000;
      proxy_read_timeout 120s;
    }

    location /healthz { proxy_pass http://backend:8000; access_log off; }

    location ~* \.(css|js|svg|woff2?)$ { add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always; try_files $uri =404; }
    location ~* \.html$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
