<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#01161E">
  <meta name="description" content="Sign in to CASE-OPS, the evidentiary ingestion, de-noising and chronology workspace for trial lawyers.">
  <title>Sign in — CASE-OPS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@600&family=Instrument+Sans:wght@400;600&family=Source+Code+Pro:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=balance,visibility,visibility_off&display=block">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="brand-id">
        <span class="logo"><span class="ms" aria-hidden="true">balance</span></span>
        <div class="brand-text">
          <span class="wordmark">CASE-OPS</span>
          <span class="tagline">Secure Legal Operations</span>
        </div>
      </div>
      <span class="badge">Demo access</span>
    </header>

    <section class="card" aria-labelledby="login-heading">
      <div>
        <h1 id="login-heading">Welcome back</h1>
        <p class="sub">Sign in to your legal workspace</p>
      </div>

      <form id="login-form" method="post" novalidate>
        <p id="form-alert" class="alert" role="alert" hidden></p>

        <div class="field">
          <label for="official-email">Official Email</label>
          <input id="official-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" value="lawyer@organization.com" placeholder="lawyer@organization.com" aria-describedby="email-error" required>
          <p id="email-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="password-input">Password</label>
          <div class="control">
            <input id="password-input" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" maxlength="128" placeholder="••••••••••••" aria-describedby="password-error" required>
            <button id="toggle-password-btn" class="toggle" type="button" aria-label="Show password" aria-controls="password-input" aria-pressed="false">
              <span id="toggle-password-icon" class="ms sm" aria-hidden="true">visibility</span>
            </button>
          </div>
          <p id="password-error" class="field-error" hidden></p>
        </div>

        <button id="sign-in-btn" class="btn" type="submit">
          <span id="sign-in-spinner" class="spin" aria-hidden="true" hidden></span>
          <span id="sign-in-label">Sign In</span>
        </button>

        <p id="login-status" class="status" role="status" aria-live="polite" hidden></p>
      </form>

      <details>
        <summary>Demo credentials</summary>
        <code>lawyer@organization.com<br>demo-access-key</code>
      </details>

      <p class="small center">Forgot password? Contact your administrator.</p>
    </section>

    <footer>
      <p class="small">Authorized personnel only • Demo build</p>
    </footer>
  </main>

  <noscript><p class="small center">CASE-OPS needs JavaScript to sign in.</p></noscript>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
